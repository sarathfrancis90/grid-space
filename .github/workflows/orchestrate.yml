name: Orchestrate Issues

on:
  workflow_dispatch:
    inputs:
      wave:
        description: "Wave number to dispatch (0 = auto-detect next wave)"
        required: false
        default: "0"
      dry_run:
        description: "Dry run — plan only, don't dispatch"
        required: false
        default: "false"
        type: boolean
      max_parallel:
        description: "Max issues to dispatch in parallel"
        required: false
        default: "3"

  push:
    branches: [main]

jobs:
  orchestrate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Closes #'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    outputs:
      dispatched_count: ${{ steps.dispatch.outputs.dispatched_count }}
      wave: ${{ steps.plan.outputs.wave }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan wave
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Fetch issues ──
          echo "::group::Fetching open parity issues"
          gh issue list --state open --label parity \
            --json number,title,labels --limit 50 > /tmp/issues.json
          ISSUE_COUNT=$(jq length /tmp/issues.json)
          echo "Found $ISSUE_COUNT open parity issues"
          echo "::endgroup::"

          if [ "$ISSUE_COUNT" = "0" ]; then
            echo "No issues to dispatch."
            echo "wave=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Check in-flight PRs ──
          echo "::group::Checking for in-flight PRs"
          IN_FLIGHT=""
          for NUM in $(jq -r '.[].number' /tmp/issues.json); do
            PR=$(gh pr list --state open --search "Closes #${NUM}" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR" ]; then
              IN_FLIGHT="$IN_FLIGHT $NUM"
              echo "  #$NUM has open PR #$PR — skip"
            fi
          done
          echo "::endgroup::"

          # ── Classify issues using index-based iteration ──
          echo "::group::Classifying issues"
          echo "[]" > /tmp/plan.json

          IDX=0
          while [ "$IDX" -lt "$ISSUE_COUNT" ]; do
            NUM=$(jq -r ".[$IDX].number" /tmp/issues.json)
            TITLE=$(jq -r ".[$IDX].title" /tmp/issues.json)
            IDX=$((IDX + 1))

            # Skip in-flight
            if echo " $IN_FLIGHT " | grep -q " $NUM "; then
              echo "  #$NUM — skipped (in-flight)"
              continue
            fi

            # Domain classification
            DOMAIN="fullstack"
            KEY_FILES=""
            AGENT_DOCS=""
            HINT=""
            STORES=""
            HAS_DEPS="false"

            case "$TITLE" in
              *[Cc]onditional*[Ff]ormat*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/data/ConditionalFormatManager.tsx,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="ConditionalFormatManager.tsx exists but is unreachable. Add menu item in Format menu."
                ;;
              *[Dd]ownload*[Cc][Ss][Vv]*|*[Cc][Ss][Vv]*[Dd]ownload*|*[Cc][Ss][Vv]*missing*)
                DOMAIN="frontend-file-ops"
                KEY_FILES="packages/client/src/components/file-ops/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="toCSV() exists in file-ops. Add Download as CSV option in File menu."
                ;;
              *[Tt]rash*|*[Rr]ecycle*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/spreadsheet.routes.ts,packages/client/src/components/dashboard/DashboardPage.tsx,packages/client/src/stores/cloudStore.ts"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md,agent_docs/api-design.md"
                HINT="Add deletedAt to Prisma schema, soft-delete endpoint, Trash tab on dashboard, restore endpoint."
                ;;
              *[Ff]older*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/components/dashboard/DashboardPage.tsx,packages/client/src/stores/cloudStore.ts"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md"
                HINT="Folder model in Prisma, CRUD API, dashboard breadcrumb nav, move-to-folder."
                HAS_DEPS="true"
                ;;
              *[Ss]how*[Ff]ormula*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/gridStore.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md,agent_docs/state-management.md"
                STORES="gridStore,cellStore,uiStore"
                HINT="View menu item + Ctrl+backtick. Toggle gridStore.showFormulas. Grid shows formula text vs value."
                ;;
              *[Aa]vatar*[Uu]pload*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/auth.routes.ts,packages/client/src/components/auth/ProfilePage.tsx"
                AGENT_DOCS="agent_docs/auth-system.md,agent_docs/backend-architecture.md"
                HINT="avatarUrl field exists in schema. Need upload endpoint, profile UI, display in CollaboratorAvatars."
                ;;
              *[Ss]uggestion*|*[Tt]rack*[Cc]hange*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/stores/cellStore.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/collaboration-system.md,agent_docs/state-management.md"
                HINT="Suggestion model in DB, WebSocket events, UI mode toggle, accept/reject UI."
                HAS_DEPS="true"
                ;;
              *[Ff]ilter*[Vv]iew*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/stores/filterStore.ts,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md"
                HINT="FilterView model in Prisma, CRUD API, Data menu submenu, active filter indicator."
                ;;
              *[Pp]ublish*[Ww]eb*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/spreadsheet.routes.ts,packages/client/src/components/sharing/ShareDialog.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/api-design.md"
                HINT="Public token/slug, read-only route (no auth), Share dialog publish section."
                ;;
              *[Ii]nsert*menu*|*[Cc]omment*[Cc]heckbox*|*[Cc]heckbox*[Dd]ropdown*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/spreadsheetStore.ts"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Add Comment/Checkbox/Dropdown/New Sheet to Insert menu."
                ;;
              *[Ee]mail*[Aa]ttach*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/src/email/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md"
                HINT="Email dialog, server endpoint to generate attachment + send via Resend, File menu entry."
                ;;
              *[Cc]ontext*[Mm]enu*|*right-click*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/ContextMenu.tsx,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Expand ContextMenu with insert/delete row/col, hide, resize, comment, link, protect."
                ;;
              *[Ee]dit*[Mm]enu*|*[Ee]dit*[Pp]aste*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/components/ui/PasteSpecialDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Add Paste Special submenu, Select All, Delete values/row/column to Edit menu."
                ;;
              *[Vv]ersion*[Hh]istory*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/components/versions/VersionHistorySidebar.tsx,packages/client/src/stores/uiStore.ts"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="VersionHistorySidebar exists. Add File menu entry to toggle visibility via uiStore."
                ;;
              *[Ii]mport*[Ff]ile*|*[Ff]ile*[Ii]mport*)
                DOMAIN="frontend-file-ops"
                KEY_FILES="packages/client/src/components/file-ops/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Import dialog with file upload, format detection, import modes. Use SheetJS/PapaParse."
                ;;
              *[Nn]otification*[Rr]ule*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/components/notifications/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/api-design.md"
                HINT="NotificationRule model, CRUD API, config dialog from Tools > Notifications."
                ;;
            esac

            # Add to plan
            jq --argjson num "$NUM" \
               --arg title "$TITLE" \
               --arg domain "$DOMAIN" \
               --arg key_files "$KEY_FILES" \
               --arg agent_docs "$AGENT_DOCS" \
               --arg hint "$HINT" \
               --arg stores "$STORES" \
               --arg has_deps "$HAS_DEPS" \
               '. + [{number: $num, title: $title, domain: $domain, key_files: $key_files, agent_docs: $agent_docs, hint: $hint, stores: $stores, has_deps: $has_deps}]' \
               /tmp/plan.json > /tmp/plan_new.json
            mv /tmp/plan_new.json /tmp/plan.json
            echo "  #$NUM -> $DOMAIN"
          done
          echo "::endgroup::"

          # ── Build waves ──
          echo "::group::Building waves"
          jq '[.[] | select(.has_deps == "false")]' /tmp/plan.json > /tmp/wave1.json
          jq '[.[] | select(.has_deps == "true")]' /tmp/plan.json > /tmp/wave2.json

          W1=$(jq length /tmp/wave1.json)
          W2=$(jq length /tmp/wave2.json)
          echo "Wave 1: $W1 issues | Wave 2: $W2 issues"
          echo "::endgroup::"

          # Determine wave
          REQUESTED="${{ inputs.wave || '0' }}"
          if [ "$REQUESTED" = "0" ]; then
            if [ "$W1" -gt 0 ]; then REQUESTED="1"; elif [ "$W2" -gt 0 ]; then REQUESTED="2"; fi
          fi
          echo "wave=$REQUESTED" >> "$GITHUB_OUTPUT"

          # ── Conflict grouping ──
          if [ "$REQUESTED" = "1" ]; then
            ACTIVE="/tmp/wave1.json"
          else
            ACTIVE="/tmp/wave2.json"
          fi

          jq '[.[] | select(.key_files | contains("MenuBar"))]' "$ACTIVE" > /tmp/menubar_group.json
          jq '[.[] | select(.key_files | contains("MenuBar") | not)]' "$ACTIVE" > /tmp/other_group.json

          MG=$(jq length /tmp/menubar_group.json)
          OG=$(jq length /tmp/other_group.json)
          echo "Conflict groups: $MG MenuBar (sequential), $OG independent"

      - name: Dispatch wave
        id: dispatch
        if: steps.plan.outputs.wave != '0' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '3' }}
        run: |
          set -euo pipefail
          WAVE="${{ steps.plan.outputs.wave }}"
          DISPATCHED=0

          echo "Dispatching Wave $WAVE"
          echo "═══════════════════════════════════════"

          dispatch_issue() {
            local IDX="$1"
            local FILE="$2"
            local NUM=$(jq -r ".[$IDX].number" "$FILE")
            local TITLE=$(jq -r ".[$IDX].title" "$FILE")
            local DOMAIN=$(jq -r ".[$IDX].domain" "$FILE")
            local KEY_FILES=$(jq -r ".[$IDX].key_files" "$FILE")
            local DOCS=$(jq -r ".[$IDX].agent_docs" "$FILE")
            local HINT=$(jq -r ".[$IDX].hint" "$FILE")
            local STORES=$(jq -r ".[$IDX].stores" "$FILE")

            echo ""
            echo "── #$NUM: $TITLE ──"

            # Build context comment
            {
              echo "## Architecture Context"
              echo ""
              echo "**Domain:** $DOMAIN"
              echo ""
              if [ -n "$HINT" ]; then
                echo "### Implementation Guidance"
                echo "$HINT"
                echo ""
              fi
              if [ -n "$KEY_FILES" ]; then
                echo "### Key Files to Read First"
                echo "$KEY_FILES" | tr ',' '\n' | while read -r f; do
                  [ -n "$f" ] && echo "- \`$f\`"
                done
                echo ""
              fi
              if [ -n "$DOCS" ]; then
                echo "### Architecture Docs"
                echo "$DOCS" | tr ',' '\n' | while read -r d; do
                  [ -n "$d" ] && echo "- \`$d\`"
                done
                echo ""
              fi
              if [ -n "$STORES" ]; then
                echo "### Zustand Stores"
                echo "$STORES" | tr ',' '\n' | while read -r s; do
                  [ -n "$s" ] && echo "- \`packages/client/src/stores/${s}.ts\`"
                done
                echo ""
              fi
              echo "### Quality Gates"
              echo "1. \`npx tsc --noEmit\`"
              echo "2. \`npx vitest run\`"
              echo "3. \`npm run build\`"
            } > /tmp/comment.md

            # Post context comment
            gh issue comment "$NUM" --body-file /tmp/comment.md

            # Add label
            gh issue edit "$NUM" --add-label "claude-code" 2>/dev/null || true

            # Trigger Claude Code workflow
            gh workflow run "Claude Code" --field issue_number="$NUM"

            echo "  #$NUM dispatched"
          }

          # Independent issues (parallel-safe)
          OG_COUNT=$(jq length /tmp/other_group.json)
          echo "Independent issues: $OG_COUNT"
          I=0
          while [ "$I" -lt "$OG_COUNT" ] && [ "$DISPATCHED" -lt "$MAX_PARALLEL" ]; do
            dispatch_issue "$I" /tmp/other_group.json
            I=$((I + 1))
            DISPATCHED=$((DISPATCHED + 1))
          done

          # MenuBar group — dispatch up to MAX_PARALLEL (each gets its own branch)
          MG_COUNT=$(jq length /tmp/menubar_group.json)
          if [ "$MG_COUNT" -gt 0 ] && [ "$DISPATCHED" -lt "$MAX_PARALLEL" ]; then
            REMAINING=$((MAX_PARALLEL - DISPATCHED))
            TO_DISPATCH=$((MG_COUNT < REMAINING ? MG_COUNT : REMAINING))
            echo ""
            echo "MenuBar group: dispatching $TO_DISPATCH of $MG_COUNT"
            J=0
            while [ "$J" -lt "$TO_DISPATCH" ]; do
              dispatch_issue "$J" /tmp/menubar_group.json
              J=$((J + 1))
              DISPATCHED=$((DISPATCHED + 1))
            done
          fi

          echo ""
          echo "═══════════════════════════════════════"
          echo "Dispatched $DISPATCHED issues"
          echo "dispatched_count=$DISPATCHED" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: inputs.dry_run == 'true'
        run: |
          echo "═══════════════════════════════════════"
          echo " DRY RUN — Wave ${{ steps.plan.outputs.wave }}"
          echo "═══════════════════════════════════════"
          echo ""
          echo "Independent:"
          jq -r '.[] | "  #\(.number) [\(.domain)] \(.title)"' /tmp/other_group.json
          echo ""
          echo "MenuBar (sequential):"
          jq -r '.[] | "  #\(.number) [\(.domain)] \(.title)"' /tmp/menubar_group.json
