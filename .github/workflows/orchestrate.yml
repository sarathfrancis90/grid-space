name: Orchestrate Issues

on:
  workflow_dispatch:
    inputs:
      wave:
        description: "Wave number to dispatch (0 = auto-detect next wave)"
        required: false
        default: "0"
      dry_run:
        description: "Dry run — plan only, don't dispatch"
        required: false
        default: "false"
        type: boolean
      max_parallel:
        description: "Max issues to dispatch in parallel"
        required: false
        default: "3"

  push:
    branches: [main]

jobs:
  orchestrate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Closes #'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    outputs:
      dispatched_count: ${{ steps.dispatch.outputs.dispatched_count }}
      wave: ${{ steps.plan.outputs.wave }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan wave
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Fetch issues ──
          echo "::group::Fetching open issues (parity + wave labels)"

          # Fetch all open enhancement issues (parity or wave-tagged)
          gh issue list --state open --label enhancement \
            --json number,title,labels --limit 100 > /tmp/all_issues.json

          # Also fetch parity issues that may not have enhancement label
          gh issue list --state open --label parity \
            --json number,title,labels --limit 50 > /tmp/parity_issues.json

          # Merge and deduplicate by issue number
          jq -s '[.[][]] | unique_by(.number) | sort_by(.number)' \
            /tmp/all_issues.json /tmp/parity_issues.json > /tmp/issues.json

          ISSUE_COUNT=$(jq length /tmp/issues.json)
          echo "Found $ISSUE_COUNT open issues"

          # Show wave breakdown
          for W in 1 2 3 4 5; do
            WC=$(jq "[.[] | select(.labels[]?.name == \"wave-$W\")] | length" /tmp/issues.json)
            echo "  wave-$W: $WC issues"
          done
          PARITY_COUNT=$(jq '[.[] | select(.labels[]?.name == "parity")] | length' /tmp/issues.json)
          echo "  parity (no wave): $PARITY_COUNT issues"
          echo "::endgroup::"

          if [ "$ISSUE_COUNT" = "0" ]; then
            echo "No issues to dispatch."
            echo "wave=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Check in-flight PRs ──
          echo "::group::Checking for in-flight PRs"
          IN_FLIGHT=""
          for NUM in $(jq -r '.[].number' /tmp/issues.json); do
            PR=$(gh pr list --state open --search "Closes #${NUM}" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR" ]; then
              IN_FLIGHT="$IN_FLIGHT $NUM"
              echo "  #$NUM has open PR #$PR — skip"
            fi
          done
          echo "::endgroup::"

          # ── Classify issues using index-based iteration ──
          echo "::group::Classifying issues"
          echo "[]" > /tmp/plan.json

          IDX=0
          while [ "$IDX" -lt "$ISSUE_COUNT" ]; do
            NUM=$(jq -r ".[$IDX].number" /tmp/issues.json)
            TITLE=$(jq -r ".[$IDX].title" /tmp/issues.json)
            IDX=$((IDX + 1))

            # Skip in-flight
            if echo " $IN_FLIGHT " | grep -q " $NUM "; then
              echo "  #$NUM — skipped (in-flight)"
              continue
            fi

            # Domain classification
            DOMAIN="fullstack"
            KEY_FILES=""
            AGENT_DOCS=""
            HINT=""
            STORES=""
            HAS_DEPS="false"

            case "$TITLE" in
              *[Cc]onditional*[Ff]ormat*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/data/ConditionalFormatManager.tsx,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="ConditionalFormatManager.tsx exists but is unreachable. Add menu item in Format menu."
                ;;
              *[Dd]ownload*[Cc][Ss][Vv]*|*[Cc][Ss][Vv]*[Dd]ownload*|*[Cc][Ss][Vv]*missing*)
                DOMAIN="frontend-file-ops"
                KEY_FILES="packages/client/src/components/file-ops/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="toCSV() exists in file-ops. Add Download as CSV option in File menu."
                ;;
              *[Tt]rash*|*[Rr]ecycle*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/spreadsheet.routes.ts,packages/client/src/components/dashboard/DashboardPage.tsx,packages/client/src/stores/cloudStore.ts"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md,agent_docs/api-design.md"
                HINT="Add deletedAt to Prisma schema, soft-delete endpoint, Trash tab on dashboard, restore endpoint."
                ;;
              *[Ff]older*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/components/dashboard/DashboardPage.tsx,packages/client/src/stores/cloudStore.ts"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md"
                HINT="Folder model in Prisma, CRUD API, dashboard breadcrumb nav, move-to-folder."
                HAS_DEPS="true"
                ;;
              *[Ss]how*[Ff]ormula*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/gridStore.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md,agent_docs/state-management.md"
                STORES="gridStore,cellStore,uiStore"
                HINT="View menu item + Ctrl+backtick. Toggle gridStore.showFormulas. Grid shows formula text vs value."
                ;;
              *[Aa]vatar*[Uu]pload*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/auth.routes.ts,packages/client/src/components/auth/ProfilePage.tsx"
                AGENT_DOCS="agent_docs/auth-system.md,agent_docs/backend-architecture.md"
                HINT="avatarUrl field exists in schema. Need upload endpoint, profile UI, display in CollaboratorAvatars."
                ;;
              *[Ss]uggestion*|*[Tt]rack*[Cc]hange*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/stores/cellStore.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/collaboration-system.md,agent_docs/state-management.md"
                HINT="Suggestion model in DB, WebSocket events, UI mode toggle, accept/reject UI."
                HAS_DEPS="true"
                ;;
              *[Ff]ilter*[Vv]iew*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/stores/filterStore.ts,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/state-management.md"
                HINT="FilterView model in Prisma, CRUD API, Data menu submenu, active filter indicator."
                ;;
              *[Pp]ublish*[Ww]eb*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/server/src/routes/spreadsheet.routes.ts,packages/client/src/components/sharing/ShareDialog.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/api-design.md"
                HINT="Public token/slug, read-only route (no auth), Share dialog publish section."
                ;;
              *[Ii]nsert*menu*|*[Cc]omment*[Cc]heckbox*|*[Cc]heckbox*[Dd]ropdown*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/spreadsheetStore.ts"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Add Comment/Checkbox/Dropdown/New Sheet to Insert menu."
                ;;
              *[Ee]mail*[Aa]ttach*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/src/email/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md"
                HINT="Email dialog, server endpoint to generate attachment + send via Resend, File menu entry."
                ;;
              *[Cc]ontext*[Mm]enu*|*right-click*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/ContextMenu.tsx,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Expand ContextMenu with insert/delete row/col, hide, resize, comment, link, protect."
                ;;
              *[Ee]dit*[Mm]enu*|*[Ee]dit*[Pp]aste*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/components/ui/PasteSpecialDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="Add Paste Special submenu, Select All, Delete values/row/column to Edit menu."
                ;;
              *[Vv]ersion*[Hh]istory*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/components/versions/VersionHistorySidebar.tsx,packages/client/src/stores/uiStore.ts"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore"
                HINT="VersionHistorySidebar exists. Add File menu entry to toggle visibility via uiStore."
                ;;
              *[Ii]mport*[Ff]ile*|*[Ff]ile*[Ii]mport*)
                DOMAIN="frontend-file-ops"
                KEY_FILES="packages/client/src/components/file-ops/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Import dialog with file upload, format detection, import modes. Use SheetJS/PapaParse."
                ;;
              *[Nn]otification*[Rr]ule*)
                DOMAIN="fullstack"
                KEY_FILES="packages/server/prisma/schema.prisma,packages/client/src/components/notifications/,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/backend-architecture.md,agent_docs/api-design.md"
                HINT="NotificationRule model, CRUD API, config dialog from Tools > Notifications."
                ;;
              *[Tt]oolbar*button*|*[Tt]oolbar*[Zz]oom*|*[Tt]oolbar*[Pp]rint*|*[Tt]oolbar*[Ff]ilter*|*[Tt]oolbar*[Ff]unction*)
                DOMAIN="frontend-toolbar"
                KEY_FILES="packages/client/src/components/toolbar/Toolbar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore,gridStore"
                HINT="Add missing toolbar buttons. Integrate existing components (ZoomControls, etc). Match Google Sheets icon style."
                ;;
              *[Cc]ell*indicator*|*comment*triangle*|*validation*arrow*|*filter*icon*|*sort*arrow*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md"
                STORES="gridStore,cellStore,commentStore,filterStore"
                HINT="Canvas rendering indicators: comment triangle, validation arrow, filter/sort icons on headers."
                ;;
              *[Ss]heet*tab*|*[Aa]ll*[Ss]heet*|*tab*navigation*|*tab*dropdown*)
                DOMAIN="frontend-sheets"
                KEY_FILES="packages/client/src/components/sheets/SheetTabs.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="spreadsheetStore"
                HINT="Add All Sheets hamburger menu, navigation arrows for tab overflow, dropdown on each tab."
                ;;
              *[Ss]tatus*[Bb]ar*|*[Ee]xplore*button*|*zoom*display*)
                DOMAIN="frontend-ui"
                KEY_FILES="packages/client/src/components/ui/StatusBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="uiStore,gridStore"
                HINT="Enhance status bar: zoom %, Explore button, collaboration count, right-click customization."
                ;;
              *[Ff]ormula*[Bb]ar*|*fx*dropdown*|*expand*collapse*)
                DOMAIN="frontend-formula"
                KEY_FILES="packages/client/src/components/formula-bar/FormulaBar.tsx"
                AGENT_DOCS="agent_docs/formula-engine.md,agent_docs/state-management.md"
                STORES="formulaStore,uiStore"
                HINT="Formula bar enhancements: expand/collapse, fx dropdown, error indicator, name box dropdown."
                ;;
              *[Ff]ill*submenu*|*[Ff]ill*[Dd]own*|*[Ff]ill*[Rr]ight*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/gridStore.ts"
                AGENT_DOCS="agent_docs/state-management.md"
                STORES="gridStore,cellStore"
                HINT="Add Fill submenu to Edit menu: Down, Right, Up, Left, Series. Ctrl+D/Ctrl+R shortcuts."
                ;;
              *[Ss]parkline*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/formula/evaluator.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/formula-engine.md,agent_docs/grid-rendering.md"
                HINT="SPARKLINE function: parse formula, render mini SVG chart in cell (line/bar/column/winloss)."
                ;;
              *[Ii]nsert*[Ss]parkline*|*[Dd]rawing*|*[Ff]unction*helper*|*[Pp]ivot*[Tt]able*[Ii]nsert*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Add Sparkline, Drawing (placeholder), Function helper, Pivot Table to Insert menu."
                ;;
              *[Tt]ext*[Rr]otation*|*[Ff]ont*submenu*|*[Ww]rapping*submenu*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/cellStore.ts"
                AGENT_DOCS="agent_docs/state-management.md,agent_docs/formatting-system.md"
                STORES="cellStore"
                HINT="Format menu: Text rotation submenu, Font/Size submenus, Text wrapping submenu."
                ;;
              *[Hh]ide*[Rr]ow*|*[Hh]ide*[Cc]olumn*|*[Ss]how*hidden*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx,packages/client/src/stores/gridStore.ts,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md,agent_docs/state-management.md"
                STORES="gridStore"
                HINT="Hide/show rows/columns from View menu and context menu. Visual indicator between hidden headers."
                ;;
              *[Hh]elp*menu*|*[Aa]bout*|*[Ww]hat*[Nn]ew*)
                DOMAIN="frontend-menu"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx"
                HINT="Expand Help menu: About dialog, What's new, Report issue link, Terms/Privacy links."
                ;;
              *[Rr]ow*[Cc]olumn*[Gg]roup*|*[Gg]roup*row*|*collapse*expand*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/grid/Grid.tsx,packages/client/src/stores/gridStore.ts,packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md,agent_docs/state-management.md"
                STORES="gridStore"
                HINT="Row/column grouping: Data menu items, +/- buttons in header gutter, nested groups, keyboard shortcuts."
                HAS_DEPS="true"
                ;;
              *[Dd]ashboard*layout*|*[Dd]ashboard*match*|*template*thumbnail*)
                DOMAIN="frontend-dashboard"
                KEY_FILES="packages/client/src/components/dashboard/DashboardPage.tsx,packages/client/src/components/dashboard/TemplateGallery.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Dashboard layout: date grouping, template thumbnails, search center, sheets icon, view toggles."
                ;;
              *[Tt]itle*[Bb]ar*|*[Ss]heets*icon*|*[Ss]tar*|*[Ss]hare*button*)
                DOMAIN="frontend-ui"
                KEY_FILES="packages/client/src/components/ui/MenuBar.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Editor title bar: green sheets icon, inline title edit, star toggle, save status, green Share button."
                ;;
              *[Pp]rint*dialog*|*[Pp]rint*preview*|*page*size*)
                DOMAIN="frontend-ui"
                KEY_FILES="packages/client/src/components/ui/PrintDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Print dialog: preview, page size, scale, gridlines checkbox, headers checkbox, print range."
                ;;
              *[Tt]heme*sidebar*|*[Tt]heme*preview*|*[Cc]ustomize*theme*)
                DOMAIN="frontend-ui"
                KEY_FILES="packages/client/src/components/ui/ThemeDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Themes as right sidebar (not modal): Customize button, chart preview cards, 8+ themes."
                ;;
              *[Dd]ata*[Vv]alidation*dialog*|*list*from*range*|*strict*warning*)
                DOMAIN="frontend-data"
                KEY_FILES="packages/client/src/components/data/DataValidationDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Data validation: list from range, strict/warning modes, input message, cell range picker."
                ;;
              *[Nn]amed*[Rr]ange*dialog*|*[Nn]amed*[Rr]ange*manage*)
                DOMAIN="frontend-data"
                KEY_FILES="packages/client/src/stores/formulaStore.ts"
                AGENT_DOCS="agent_docs/state-management.md,agent_docs/formula-engine.md"
                HINT="Named Ranges management sidebar: list, create, edit, delete, jump to range."
                ;;
              *[Ff]ind*[Rr]eplace*|*match*highlight*|*search*formula*)
                DOMAIN="frontend-data"
                KEY_FILES="packages/client/src/components/data/FindReplace.tsx,packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Find & Replace: match highlighting in grid, search in formulas/values toggle, selection scope."
                ;;
              *[Cc]hart*type*|*[Bb]ubble*chart*|*[Gg]auge*chart*|*series*format*)
                DOMAIN="frontend-charts"
                KEY_FILES="packages/client/src/components/charts/ChartEditorSidebar.tsx,packages/client/src/components/charts/ChartRenderer.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Charts: Bubble/Gauge types, smooth lines, dual axis, series formatting, download as image."
                ;;
              *[Cc]onditional*[Ff]ormat*manage*|*rule*reorder*|*quick*rule*)
                DOMAIN="frontend-data"
                KEY_FILES="packages/client/src/components/data/ConditionalFormatManager.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Conditional formatting: manage rules dialog, drag-reorder, stop-if-true, quick rules."
                ;;
              *[Tt]oolbar*icon*|*icon*style*|*toolbar*spacing*|*toolbar*divider*)
                DOMAIN="frontend-toolbar"
                KEY_FILES="packages/client/src/components/toolbar/Toolbar.tsx"
                HINT="Toolbar styling: outlined icons, thin dividers between groups, hover/active states, dropdown arrows."
                ;;
              *[Gg]rid*styl*|*header*color*|*selection*blue*|*column*width*|*row*height*)
                DOMAIN="frontend-grid"
                KEY_FILES="packages/client/src/components/grid/Grid.tsx"
                AGENT_DOCS="agent_docs/grid-rendering.md"
                HINT="Grid styling: header colors #f8f9fa, selection blue #1a73e8, default col width 100px, row height 21px."
                ;;
              *[Cc]omment*assign*|*comment*count*|*comment*sort*)
                DOMAIN="frontend-ui"
                KEY_FILES="packages/client/src/components/ui/CommentPanel.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Comments: assign dropdown, cell count badge, sort by date/status."
                ;;
              *[Vv]ersion*[Hh]istory*author*|*version*compare*|*change*summary*)
                DOMAIN="frontend-versions"
                KEY_FILES="packages/client/src/components/versions/VersionHistorySidebar.tsx,packages/client/src/components/versions/VersionDiff.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Version history: author display, change summary, side-by-side diff, color-coded changes."
                ;;
              *[Ss]hare*dialog*|*transfer*owner*|*link*expir*|*notify*collabor*)
                DOMAIN="frontend-sharing"
                KEY_FILES="packages/client/src/components/sharing/ShareDialog.tsx"
                AGENT_DOCS="agent_docs/state-management.md"
                HINT="Share dialog: notify checkbox, transfer ownership, link expiration, viewer restrictions."
                ;;
            esac

            # Add to plan
            jq --argjson num "$NUM" \
               --arg title "$TITLE" \
               --arg domain "$DOMAIN" \
               --arg key_files "$KEY_FILES" \
               --arg agent_docs "$AGENT_DOCS" \
               --arg hint "$HINT" \
               --arg stores "$STORES" \
               --arg has_deps "$HAS_DEPS" \
               '. + [{number: $num, title: $title, domain: $domain, key_files: $key_files, agent_docs: $agent_docs, hint: $hint, stores: $stores, has_deps: $has_deps}]' \
               /tmp/plan.json > /tmp/plan_new.json
            mv /tmp/plan_new.json /tmp/plan.json
            echo "  #$NUM -> $DOMAIN"
          done
          echo "::endgroup::"

          # ── Build dispatch queue (priority: wave-1 > wave-2 > ... > parity > untagged) ──
          echo "::group::Building dispatch queue"

          # Filter planned issues by wave priority
          echo "[]" > /tmp/dispatch_queue.json
          for W in 1 2 3 4 5; do
            jq --arg w "wave-$W" '[.[] | select(.labels[]?.name == $w)]' /tmp/issues.json > "/tmp/wave${W}_issues.json"
            # Match planned items against wave issues
            WAVE_NUMS=$(jq -r '.[].number' "/tmp/wave${W}_issues.json" 2>/dev/null || echo "")
            for N in $WAVE_NUMS; do
              MATCH=$(jq --argjson n "$N" '[.[] | select(.number == $n)]' /tmp/plan.json)
              if [ "$(echo "$MATCH" | jq length)" -gt 0 ]; then
                jq --argjson items "$MATCH" '. + $items' /tmp/dispatch_queue.json > /tmp/dq_tmp.json
                mv /tmp/dq_tmp.json /tmp/dispatch_queue.json
              fi
            done
          done

          # Add remaining planned items (parity or untagged)
          QUEUED_NUMS=$(jq -r '.[].number' /tmp/dispatch_queue.json | tr '\n' '|' | sed 's/|$//')
          if [ -n "$QUEUED_NUMS" ]; then
            jq "[.[] | select(.number | tostring | test(\"^($QUEUED_NUMS)\$\") | not)]" /tmp/plan.json > /tmp/remaining.json
          else
            cp /tmp/plan.json /tmp/remaining.json
          fi
          jq -s '.[0] + .[1]' /tmp/dispatch_queue.json /tmp/remaining.json > /tmp/dq_final.json
          mv /tmp/dq_final.json /tmp/dispatch_queue.json

          TOTAL_QUEUED=$(jq length /tmp/dispatch_queue.json)
          echo "Total dispatch queue: $TOTAL_QUEUED issues"
          jq -r '.[] | "  #\(.number) \(.title)"' /tmp/dispatch_queue.json
          echo "::endgroup::"

          REQUESTED="${{ inputs.wave || '1' }}"
          echo "wave=$REQUESTED" >> "$GITHUB_OUTPUT"

          # ── Conflict grouping from dispatch queue ──
          jq '[.[] | select(.key_files | contains("MenuBar"))]' /tmp/dispatch_queue.json > /tmp/menubar_group.json
          jq '[.[] | select(.key_files | contains("MenuBar") | not)]' /tmp/dispatch_queue.json > /tmp/other_group.json

          MG=$(jq length /tmp/menubar_group.json)
          OG=$(jq length /tmp/other_group.json)
          echo "Conflict groups: $MG MenuBar, $OG independent"

      - name: Dispatch wave
        id: dispatch
        if: steps.plan.outputs.wave != '0' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '3' }}
        run: |
          set -euo pipefail
          WAVE="${{ steps.plan.outputs.wave }}"
          DISPATCHED=0

          echo "Dispatching Wave $WAVE"
          echo "═══════════════════════════════════════"

          dispatch_issue() {
            local IDX="$1"
            local FILE="$2"
            local NUM=$(jq -r ".[$IDX].number" "$FILE")
            local TITLE=$(jq -r ".[$IDX].title" "$FILE")
            local DOMAIN=$(jq -r ".[$IDX].domain" "$FILE")
            local KEY_FILES=$(jq -r ".[$IDX].key_files" "$FILE")
            local DOCS=$(jq -r ".[$IDX].agent_docs" "$FILE")
            local HINT=$(jq -r ".[$IDX].hint" "$FILE")
            local STORES=$(jq -r ".[$IDX].stores" "$FILE")

            echo ""
            echo "── #$NUM: $TITLE ──"

            # Build context comment
            {
              echo "## Architecture Context"
              echo ""
              echo "**Domain:** $DOMAIN"
              echo ""
              if [ -n "$HINT" ]; then
                echo "### Implementation Guidance"
                echo "$HINT"
                echo ""
              fi
              if [ -n "$KEY_FILES" ]; then
                echo "### Key Files to Read First"
                echo "$KEY_FILES" | tr ',' '\n' | while read -r f; do
                  [ -n "$f" ] && echo "- \`$f\`"
                done
                echo ""
              fi
              if [ -n "$DOCS" ]; then
                echo "### Architecture Docs"
                echo "$DOCS" | tr ',' '\n' | while read -r d; do
                  [ -n "$d" ] && echo "- \`$d\`"
                done
                echo ""
              fi
              if [ -n "$STORES" ]; then
                echo "### Zustand Stores"
                echo "$STORES" | tr ',' '\n' | while read -r s; do
                  [ -n "$s" ] && echo "- \`packages/client/src/stores/${s}.ts\`"
                done
                echo ""
              fi
              echo "### Quality Gates"
              echo "1. \`npx tsc --noEmit\`"
              echo "2. \`npx vitest run\`"
              echo "3. \`npm run build\`"
            } > /tmp/comment.md

            # Post context comment
            gh issue comment "$NUM" --body-file /tmp/comment.md

            # Add label
            gh issue edit "$NUM" --add-label "claude-code" 2>/dev/null || true

            # Trigger Claude Code workflow
            gh workflow run "Claude Code" --field issue_number="$NUM"

            echo "  #$NUM dispatched"
          }

          # Independent issues (parallel-safe)
          OG_COUNT=$(jq length /tmp/other_group.json)
          echo "Independent issues: $OG_COUNT"
          I=0
          while [ "$I" -lt "$OG_COUNT" ] && [ "$DISPATCHED" -lt "$MAX_PARALLEL" ]; do
            dispatch_issue "$I" /tmp/other_group.json
            I=$((I + 1))
            DISPATCHED=$((DISPATCHED + 1))
          done

          # MenuBar group — dispatch up to MAX_PARALLEL (each gets its own branch)
          MG_COUNT=$(jq length /tmp/menubar_group.json)
          if [ "$MG_COUNT" -gt 0 ] && [ "$DISPATCHED" -lt "$MAX_PARALLEL" ]; then
            REMAINING=$((MAX_PARALLEL - DISPATCHED))
            TO_DISPATCH=$((MG_COUNT < REMAINING ? MG_COUNT : REMAINING))
            echo ""
            echo "MenuBar group: dispatching $TO_DISPATCH of $MG_COUNT"
            J=0
            while [ "$J" -lt "$TO_DISPATCH" ]; do
              dispatch_issue "$J" /tmp/menubar_group.json
              J=$((J + 1))
              DISPATCHED=$((DISPATCHED + 1))
            done
          fi

          echo ""
          echo "═══════════════════════════════════════"
          echo "Dispatched $DISPATCHED issues"
          echo "dispatched_count=$DISPATCHED" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: inputs.dry_run == 'true'
        run: |
          echo "═══════════════════════════════════════"
          echo " DRY RUN — Dispatch Queue"
          echo "═══════════════════════════════════════"
          echo ""
          echo "Independent ($OG_COUNT):"
          jq -r '.[] | "  #\(.number) [\(.domain)] \(.title)"' /tmp/other_group.json 2>/dev/null || true
          echo ""
          echo "MenuBar group ($MG_COUNT):"
          jq -r '.[] | "  #\(.number) [\(.domain)] \(.title)"' /tmp/menubar_group.json 2>/dev/null || true
